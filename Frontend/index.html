<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pirnav Junior College Management System" />
    <meta name="theme-color" content="#6F8400" />
    <title>Pirnav Junior College</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      try {
        var theme = localStorage.getItem('pirnav-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#161916' : '#6F8400');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
