<svg viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9D9D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#704214;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="600" height="700" fill="url(#skyGradient)"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="80" rx="60" ry="30" fill="white" opacity="0.7"/>
  <ellipse cx="150" cy="90" rx="50" ry="25" fill="white" opacity="0.6"/>
  <ellipse cx="500" cy="120" rx="70" ry="35" fill="white" opacity="0.65"/>
  <ellipse cx="550" cy="135" rx="55" ry="28" fill="white" opacity="0.6"/>
  
  <!-- Main building body -->
  <rect x="80" y="220" width="440" height="380" fill="url(#buildingGradient)" stroke="#B0B0B0" stroke-width="2"/>
  
  <!-- Building shadow/depth -->
  <rect x="520" y="220" width="8" height="380" fill="#CCCCCC"/>
  
  <!-- Roof -->
  <polygon points="80,220 300,80 520,220" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
  
  <!-- Roof edge highlight -->
  <polygon points="82,222 300,82 518,222" fill="none" stroke="#CD853F" stroke-width="1" opacity="0.6"/>
  
  <!-- Cupola/Tower -->
  <rect x="280" y="50" width="40" height="40" fill="#A0522D" stroke="#654321" stroke-width="1"/>
  <polygon points="280,50 300,30 320,50" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Flag pole -->
  <rect x="297" y="25" width="6" height="30" fill="#333"/>
  <!-- Flag -->
  <polygon points="303,35 303,45 325,40" fill="#E31937"/>
  
  <!-- Left wing of building -->
  <rect x="80" y="320" width="140" height="280" fill="#E8E8E8" stroke="#A0A0A0" stroke-width="1"/>
  
  <!-- Right wing of building -->
  <rect x="380" y="320" width="140" height="280" fill="#EEEEEE" stroke="#A0A0A0" stroke-width="1"/>
  
  <!-- Windows - Left Column -->
  <rect x="110" y="250" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="127.5" y1="250" x2="127.5" y2="285" stroke="#2C3E50" stroke-width="1"/>
  <line x1="110" y1="267.5" x2="145" y2="267.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="110" y="305" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="127.5" y1="305" x2="127.5" y2="340" stroke="#2C3E50" stroke-width="1"/>
  <line x1="110" y1="322.5" x2="145" y2="322.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="110" y="360" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="127.5" y1="360" x2="127.5" y2="395" stroke="#2C3E50" stroke-width="1"/>
  <line x1="110" y1="377.5" x2="145" y2="377.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="110" y="415" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="127.5" y1="415" x2="127.5" y2="450" stroke="#2C3E50" stroke-width="1"/>
  <line x1="110" y1="432.5" x2="145" y2="432.5" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Windows - Center Column -->
  <rect x="217.5" y="250" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="235" y1="250" x2="235" y2="285" stroke="#2C3E50" stroke-width="1"/>
  <line x1="217.5" y1="267.5" x2="252.5" y2="267.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="217.5" y="305" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="235" y1="305" x2="235" y2="340" stroke="#2C3E50" stroke-width="1"/>
  <line x1="217.5" y1="322.5" x2="252.5" y2="322.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="217.5" y="360" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="235" y1="360" x2="235" y2="395" stroke="#2C3E50" stroke-width="1"/>
  <line x1="217.5" y1="377.5" x2="252.5" y2="377.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="217.5" y="415" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="235" y1="415" x2="235" y2="450" stroke="#2C3E50" stroke-width="1"/>
  <line x1="217.5" y1="432.5" x2="252.5" y2="432.5" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Windows - Right Column -->
  <rect x="325" y="250" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="342.5" y1="250" x2="342.5" y2="285" stroke="#2C3E50" stroke-width="1"/>
  <line x1="325" y1="267.5" x2="360" y2="267.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="325" y="305" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="342.5" y1="305" x2="342.5" y2="340" stroke="#2C3E50" stroke-width="1"/>
  <line x1="325" y1="322.5" x2="360" y2="322.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="325" y="360" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="342.5" y1="360" x2="342.5" y2="395" stroke="#2C3E50" stroke-width="1"/>
  <line x1="325" y1="377.5" x2="360" y2="377.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="325" y="415" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="342.5" y1="415" x2="342.5" y2="450" stroke="#2C3E50" stroke-width="1"/>
  <line x1="325" y1="432.5" x2="360" y2="432.5" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Windows - Far Right Column -->
  <rect x="432.5" y="250" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="450" y1="250" x2="450" y2="285" stroke="#2C3E50" stroke-width="1"/>
  <line x1="432.5" y1="267.5" x2="467.5" y2="267.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="432.5" y="305" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="450" y1="305" x2="450" y2="340" stroke="#2C3E50" stroke-width="1"/>
  <line x1="432.5" y1="322.5" x2="467.5" y2="322.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="432.5" y="360" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="450" y1="360" x2="450" y2="395" stroke="#2C3E50" stroke-width="1"/>
  <line x1="432.5" y1="377.5" x2="467.5" y2="377.5" stroke="#2C3E50" stroke-width="1"/>
  
  <rect x="432.5" y="415" width="35" height="35" fill="#4A90E2" stroke="#2C3E50" stroke-width="1"/>
  <line x1="450" y1="415" x2="450" y2="450" stroke="#2C3E50" stroke-width="1"/>
  <line x1="432.5" y1="432.5" x2="467.5" y2="432.5" stroke="#2C3E50" stroke-width="1"/>
  
  <!-- Main entrance door -->
  <rect x="275" y="490" width="50" height="110" fill="#654321" stroke="#3D2817" stroke-width="2"/>
  <circle cx="320" cy="545" r="5" fill="#C0A080"/>
  
  <!-- Door details - panels -->
  <line x1="275" y1="535" x2="325" y2="535" stroke="#3D2817" stroke-width="1"/>
  <line x1="300" y1="490" x2="300" y2="600" stroke="#3D2817" stroke-width="1" opacity="0.5"/>
  
  <!-- Base/Foundation -->
  <rect x="80" y="600" width="440" height="80" fill="#A89968" stroke="#8B7355" stroke-width="2"/>
  <rect x="80" y="600" width="440" height="8" fill="#C4B5A0"/>
  
  <!-- Ground -->
  <rect x="0" y="680" width="600" height="20" fill="#8B7355"/>
  <rect x="0" y="680" width="600" height="3" fill="#6B5344"/>
  
  <!-- Landscaping - Left side -->
  <ellipse cx="40" cy="630" rx="35" ry="50" fill="#228B22"/>
  <ellipse cx="50" cy="610" rx="28" ry="40" fill="#2E8B57"/>
  
  <!-- Landscaping - Right side -->
  <ellipse cx="560" cy="630" rx="35" ry="50" fill="#228B22"/>
  <ellipse cx="550" cy="610" rx="28" ry="40" fill="#2E8B57"/>
  
  <!-- Flagpole shadow -->
  <rect x="297.5" y="95" width="2" height="5" fill="rgba(0,0,0,0.2)"/>
</svg>